# ============================================================
# Trader Operation — docker-compose.yml (skill 00: infraestrutura)
# ============================================================
# Infraestrutura de desenvolvimento local + nucleo-backend (skill 01).
# motor-quant entra na skill 04.
#
# Portas e credenciais vêm do .env (ver .env.example); todas
# têm valor padrão, então o compose sobe mesmo sem .env.
# Credenciais aqui são SOMENTE de desenvolvimento.
# ============================================================

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg16
    container_name: trader-postgres
    environment:
      POSTGRES_USER: ${TRADER_POSTGRES_USER:-trader}
      POSTGRES_PASSWORD: ${TRADER_POSTGRES_PASSWORD:-trader_dev}
      POSTGRES_DB: ${TRADER_POSTGRES_DB:-trader}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${TRADER_POSTGRES_PORT:-5434}:5432"
    volumes:
      - trader_pgdata:/var/lib/postgresql/data
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: trader-redis
    ports:
      - "${TRADER_REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Armazenamento compatível com S3 (arquivos de estratégias, relatórios).
  # SeaweedFS no lugar do MinIO: as imagens oficiais do MinIO saíram do
  # Docker Hub (ver D-08 em decisoes-tomadas.md).
  s3:
    image: chrislusf/seaweedfs:4.48
    container_name: trader-s3
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "${TRADER_S3_PORT:-8333}:8333"
    volumes:
      - trader_s3data:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  # Container efêmero: cria o bucket privado e sai.
  s3-init:
    image: amazon/aws-cli:2.37.9
    container_name: trader-s3-init
    depends_on:
      s3:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${TRADER_S3_ACCESS_KEY:-trader_dev}
      AWS_SECRET_ACCESS_KEY: ${TRADER_S3_SECRET_KEY:-trader_dev_secret}
      AWS_DEFAULT_REGION: us-east-1
      BUCKET: ${TRADER_S3_BUCKET:-trader-arquivos}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        aws --endpoint-url http://s3:8333 s3api head-bucket --bucket "$$BUCKET" 2>/dev/null \
          || aws --endpoint-url http://s3:8333 s3 mb "s3://$$BUCKET"
        echo "Bucket $$BUCKET pronto."
    restart: "no"

  nucleo-backend:
    build:
      context: ./nucleo-backend
      dockerfile: Dockerfile.dev
    container_name: trader-nucleo-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: docker
      TRADER_POSTGRES_USER: ${TRADER_POSTGRES_USER:-trader}
      TRADER_POSTGRES_PASSWORD: ${TRADER_POSTGRES_PASSWORD:-trader_dev}
      TRADER_POSTGRES_DB: ${TRADER_POSTGRES_DB:-trader}
      TRADER_S3_ACCESS_KEY: ${TRADER_S3_ACCESS_KEY:-trader_dev}
      TRADER_S3_SECRET_KEY: ${TRADER_S3_SECRET_KEY:-trader_dev_secret}
      TRADER_S3_BUCKET: ${TRADER_S3_BUCKET:-trader-arquivos}
      TRADER_JWT_SECRET: ${TRADER_JWT_SECRET:-dev-somente-local-troque-em-producao-0123456789abcdef0123456789abcdef}
    ports:
      - "${TRADER_BACKEND_PORT:-8090}:8090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8090/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # frontend-app servido por nginx (skill 03). O dev local do dia a dia
  # roda `npm run dev` direto no WSL; este container fecha o compose do produto.
  frontend-app:
    build:
      context: ./frontend-app
      dockerfile: Dockerfile
    container_name: trader-frontend-app
    depends_on:
      nucleo-backend:
        condition: service_healthy
    ports:
      - "${TRADER_FRONTEND_PORT:-5173}:80"
    restart: unless-stopped

volumes:
  trader_pgdata:
  trader_s3data:
