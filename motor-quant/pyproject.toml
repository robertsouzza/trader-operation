[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "motor-quant"
version = "0.1.0"
description = "Motor quantitativo do Trader Operation: candles e indicadores sobre dados de mercado."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.10.4",
  "pydantic-settings==2.7.1",
  "pandas==2.2.3",
  "numpy==2.2.1",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.25.2",
  "httpx==0.28.1",
  "ruff==0.8.6",
  "mypy==1.14.1",
  "pandas-stubs==2.2.3.241126",
]

[project.scripts]
motor-quant = "motor_quant.main:executar"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
motor_quant = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "SIM"]
ignore = ["E501"]  # linhas longas tratadas pelo formatador

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802"]  # nomes de teste em pt-BR podem usar underline

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_untyped_decorators = false  # FastAPI usa muito decorator não-tipado
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["motor_quant.main"]
disable_error_code = ["misc"]  # @app.on_event é deprecated no FastAPI; lifecycle fica em main
